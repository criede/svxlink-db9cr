name: Sync upstream

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC, 03:17 CET / 04:17 CEST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'criede/svxlink-db9cr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/sm0svx/svxlink.git
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'Already up to date.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Prefer our conflicting hunks, while merging non-conflicting upstream changes.
          if ! git merge --no-commit --no-ff -X ours upstream/master; then
            # A failed merge without MERGE_HEAD is an error, not a resolvable conflict.
            git rev-parse --verify MERGE_HEAD >/dev/null
            if [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
              echo '::error::Merge failed without unresolved conflicts.'
              exit 1
            fi

            # Resolve remaining structural conflicts (e.g. modify/delete) from HEAD.
            # Missing paths in HEAD represent deletions that must also be preserved.
            while IFS= read -r -d '' path; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git --literal-pathspecs restore --source=HEAD --staged --worktree -- "$path"
              else
                git --literal-pathspecs rm -f -- "$path"
              fi
              printf 'Resolved conflict in favor of master: %s\n' "$path"
            done < <(git diff --name-only --diff-filter=U -z)

            git diff --quiet --diff-filter=U
          fi

          # Keep our workflow definitions exactly, including local additions/deletions.
          # --no-ff above ensures this happens before committing even a fast-forward.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git commit --no-edit

          # Never force-push: concurrent changes on master must be preserved.
          git push origin HEAD:refs/heads/master
          echo 'Merged sm0svx/svxlink master into master.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record synchronized source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  daily-deb:
    name: ${{ matrix.suite }}/${{ matrix.arch }} daily package
    needs: sync
    strategy:
      # Sequential: the "Publish package to APT repository" step below
      # commits and pushes to the shared gh-pages branch; running matrix
      # legs in parallel would race on that push.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          # Currently maintained Debian-based releases (Debian and
          # Raspberry Pi OS use the same package base per codename, so one
          # build per codename/architecture covers both), for both arm64
          # (Raspberry Pi) and amd64 (Intel/AMD PCs and servers). Each leg
          # builds natively on a runner matching its architecture, so no
          # QEMU emulation is needed. Add further entries here for
          # additional Debian/Ubuntu versions or architectures.
          - suite: bookworm
            arch: arm64
            runner: ubuntu-24.04-arm
          - suite: trixie
            arch: arm64
            runner: ubuntu-24.04-arm
          - suite: bookworm
            arch: amd64
            runner: ubuntu-24.04
          - suite: trixie
            arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out synchronized source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
        with:
          ref: ${{ needs.sync.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build Debian package for ${{ matrix.suite }}/${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/daily-deb"
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/daily-deb:/output" \
            -e GITHUB_RUN_NUMBER -e GITHUB_RUN_ATTEMPT \
            "debian:${{ matrix.suite }}-slim" bash /source/.github/scripts/build-daily-deb.sh

      - name: Test installation in clean ${{ matrix.suite }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            -v "$RUNNER_TEMP/daily-deb:/packages:ro" \
            "debian:${{ matrix.suite }}-slim" bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends /packages/*.deb
              test "$(dpkg-query -W -f="\${Architecture}" svxlink)" = "${{ matrix.arch }}"
              svxlink --version
              test -f /usr/lib/systemd/system/svxlink.service
            '

      - name: Publish daily prerelease directly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/daily-deb"
          version=$(cat VERSION)
          tag="daily-${version//\~/-}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.deb SHA256SUMS --clobber
          else
            gh release create "$tag" ./*.deb SHA256SUMS \
              --target "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
              --title "Daily ${version} — ${{ matrix.suite }}/${{ matrix.arch }}" \
              --notes-file BUILD-INFO.MD --prerelease --latest=false
          fi
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Install APT repository tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnupg dpkg-dev apt-utils

      - name: Import APT repository signing key
        id: gpgimport
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          test -n "$fpr"
          echo "::add-mask::$fpr"
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"

      - name: Publish package to APT repository (GitHub Pages)
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_KEY_FPR: ${{ steps.gpgimport.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/daily-deb"
          SUITE=$(cat SUITE)
          ARCH=$(cat ARCH)
          checkout="$RUNNER_TEMP/gh-pages"
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch --depth 1 "$repo_url" "$checkout"
          else
            git clone --depth 1 "$repo_url" "$checkout"
            git -C "$checkout" checkout --orphan gh-pages
            git -C "$checkout" rm -rf . >/dev/null 2>&1 || true
          fi
          git -C "$checkout" config user.name 'github-actions[bot]'
          git -C "$checkout" config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          REPO_DIR="$checkout" DEB_FILE="$(echo "$RUNNER_TEMP"/daily-deb/*.deb)" \
            SUITE="$SUITE" ARCH="$ARCH" GPG_KEY_FPR="$GPG_KEY_FPR" \
            bash "$GITHUB_WORKSPACE/.github/scripts/publish-apt-repo.sh"

          cd "$checkout"
          git add -A
          if git diff --cached --quiet; then
            echo 'APT repository unchanged.' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Add ${SUITE}/${ARCH} package $(cat "$RUNNER_TEMP/daily-deb/VERSION")" >/dev/null
            git push origin HEAD:refs/heads/gh-pages
            echo "Published ${SUITE}/${ARCH} package to the APT repository (gh-pages)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove imported signing key
        if: always()
        shell: bash
        run: gpgconf --kill gpg-agent 2>/dev/null; rm -rf "$HOME/.gnupg"

      - name: Remove temporary package files
        if: always()
        shell: bash
        run: |
          docker run --rm -v "$RUNNER_TEMP/daily-deb:/output" \
            "debian:${{ matrix.suite }}-slim" sh -c 'find /output -mindepth 1 -delete'

  cleanup-old-releases:
    name: Prune old daily releases
    needs: daily-deb
    if: always() && github.repository == 'criede/svxlink-db9cr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
        with:
          persist-credentials: false

      - name: Prune daily releases outside the retention window
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: bash .github/scripts/prune-daily-releases.sh
