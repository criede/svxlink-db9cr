name: Sync upstream

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC, 03:17 CET / 04:17 CEST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'criede/svxlink-db9cr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/sm0svx/svxlink.git
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'Already up to date.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Prefer our conflicting hunks, while merging non-conflicting upstream changes.
          if ! git merge --no-commit --no-ff -X ours upstream/master; then
            # A failed merge without MERGE_HEAD is an error, not a resolvable conflict.
            git rev-parse --verify MERGE_HEAD >/dev/null
            if [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
              echo '::error::Merge failed without unresolved conflicts.'
              exit 1
            fi

            # Resolve remaining structural conflicts (e.g. modify/delete) from HEAD.
            # Missing paths in HEAD represent deletions that must also be preserved.
            while IFS= read -r -d '' path; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git --literal-pathspecs restore --source=HEAD --staged --worktree -- "$path"
              else
                git --literal-pathspecs rm -f -- "$path"
              fi
              printf 'Resolved conflict in favor of master: %s\n' "$path"
            done < <(git diff --name-only --diff-filter=U -z)

            git diff --quiet --diff-filter=U
          fi

          # Keep our workflow definitions exactly, including local additions/deletions.
          # --no-ff above ensures this happens before committing even a fast-forward.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git commit --no-edit

          # Never force-push: concurrent changes on master must be preserved.
          git push origin HEAD:refs/heads/master
          echo 'Merged sm0svx/svxlink master into master.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record synchronized source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  daily-deb:
    name: Raspberry Pi OS arm64 daily package
    needs: sync
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out synchronized source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
        with:
          ref: ${{ needs.sync.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build Debian package for Raspberry Pi OS Trixie
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/daily-deb"
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/daily-deb:/output" \
            -e GITHUB_RUN_NUMBER -e GITHUB_RUN_ATTEMPT \
            debian:trixie-slim bash /source/.github/scripts/build-daily-deb.sh

      - name: Test installation in clean Debian Trixie
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$RUNNER_TEMP/daily-deb:/packages:ro" \
            debian:trixie-slim bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends /packages/*.deb
              test "$(dpkg-query -W -f="\${Architecture}" svxlink)" = arm64
              svxlink --version
              test -f /usr/lib/systemd/system/svxlink.service
            '

      - name: Publish daily prerelease directly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/daily-deb"
          version=$(cat VERSION)
          tag="daily-${version//\~/-}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.deb SHA256SUMS --clobber
          else
            gh release create "$tag" ./*.deb SHA256SUMS \
              --target "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
              --title "Daily ${version} — Raspberry Pi OS arm64" \
              --notes-file BUILD-INFO.MD --prerelease --latest=false
          fi
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary package files
        if: always()
        shell: bash
        run: |
          docker run --rm -v "$RUNNER_TEMP/daily-deb:/output" \
            debian:trixie-slim sh -c 'find /output -mindepth 1 -delete'
